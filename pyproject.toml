[project]
    authors = [{ name = "David D Lawson", email = "david@lawson.dev" }]
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3.12",
        "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]
    dependencies = []
    description = "Pythonic wrapper for the Planhat REST API"
    keywords = ["api", "crm", "planhat", "rest", "sdk", "wrapper"]
    name = "pyplanhat"
    readme = "README.md"
    requires-python = ">=3.12,<3.14"
    version = "0.1.0"

    [project.scripts]
        pyplanhat = "pyplanhat:main"

[build-system]
    build-backend = "hatchling.build"
    requires      = ["hatchling"]

    [project.optional-dependencies]
        dev  = ["coverage", "ipython", "mypy", "pytest", "pytest-cov", "responses", "ruff"]
        test = ["pytest", "pytest-cov", "responses"]

[tool.ruff]
    line-length    = 99
    select         = ["E", "F", "I", "RUF", "UP"]
    target-version = "py313"

    [tool.ruff.lint]
        ignore = [
            "D10",
            "D203",
            "D213",
            "D215",
            "D400",
            "D404",
            "D406",
            "D407",
            "D408",
            "D409",
            "D413",
            "D415",
        ]
[tool.mypy]
    disallow_untyped_defs  = true
    exclude                = [".venv/", "dist/", "tests/"]
    ignore_missing_imports = true
    python_version         = "3.12"

[tool.pytest.ini_options]
    addopts = "-q"
